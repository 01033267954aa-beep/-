services:
  - type: web
    runtime: static
    name: meow-cafe-tycoon
    buildCommand: echo "No build step required for static HTML/CSS/JS"
    staticPublishPath: ./
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: true
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
