<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meow Cafe Tycoon</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand-block" aria-label="게임 이름">
        <span class="brand-mark" aria-hidden="true">🐾</span>
        <div>
          <h1>Meow Cafe Tycoon</h1>
          <p>고양이 카페 운영 중</p>
        </div>
      </div>

      <div class="hud" aria-label="게임 상태">
        <div class="hud-item coins">
          <span aria-hidden="true">🪙</span>
          <strong id="coinCount">500</strong>
          <span>코인</span>
        </div>

        <div class="level-box">
          <div class="level-label">
            <span id="levelLabel">Lv. 1</span>
            <span id="xpLabel">0 / 100 XP</span>
          </div>
          <div class="xp-track" aria-label="경험치">
            <div id="xpFill" class="xp-fill"></div>
          </div>
        </div>

        <button id="settingsButton" class="icon-button" type="button" aria-label="설정 열기">
          ⚙️
        </button>
      </div>
    </header>

    <main class="game-layout">
      <section class="play-section" aria-label="카페 플레이 공간">
        <div id="eventBanner" class="event-banner" aria-live="polite"></div>

        <div id="cafeStage" class="cafe-stage">
          <div class="cafe-wall" aria-hidden="true"></div>
          <div class="window-shape window-one" aria-hidden="true"></div>
          <div class="window-shape window-two" aria-hidden="true"></div>
          <div class="counter-shape" aria-hidden="true"></div>

          <div id="furnitureLayer" class="furniture-layer" aria-hidden="true"></div>
          <div id="tableLayer" class="table-layer" aria-label="테이블"></div>
          <div id="customerLayer" class="customer-layer" aria-label="손님"></div>
          <div id="catLayer" class="cat-layer" aria-label="고양이"></div>
          <div id="floatingLayer" class="floating-layer" aria-hidden="true"></div>

          <button id="coffeeMachine" class="coffee-machine" type="button" aria-label="커피 머신에서 음료 제작">
            <span class="machine-emoji" aria-hidden="true">☕</span>
            <span class="machine-title">커피 머신</span>
            <span id="machineStatus" class="machine-status">주문 대기</span>
            <span class="machine-progress" aria-hidden="true">
              <span id="machineProgressFill"></span>
            </span>
          </button>

          <button id="cupEventButton" class="cup-event hidden" type="button" aria-label="떨어진 컵 줍기">
            🥤
          </button>
        </div>
      </section>

      <aside id="sidePanel" class="side-panel" aria-label="관리 메뉴">
        <div class="panel-header">
          <h2>관리 메뉴</h2>
          <button id="quickSaveButton" class="small-button" type="button">저장</button>
        </div>

        <div class="summary-grid">
          <div>
            <span>테이블</span>
            <strong id="tableSummary">2개</strong>
          </div>
          <div>
            <span>완성 음료</span>
            <strong id="drinkSummary">0잔</strong>
          </div>
          <div>
            <span>손님</span>
            <strong id="customerSummary">0명</strong>
          </div>
          <div>
            <span>판매</span>
            <strong id="salesSummary">0회</strong>
          </div>
        </div>

        <div class="panel-actions">
          <button id="openShopButton" class="primary-button" type="button">상점 열기</button>
          <button id="openCatsButton" class="secondary-button" type="button">고양이 보기</button>
        </div>

        <section class="upgrade-section" aria-labelledby="upgradeTitle">
          <div class="section-title-row">
            <h2 id="upgradeTitle">업그레이드</h2>
            <span id="upgradeHint">수익을 올려 카페를 확장하세요</span>
          </div>
          <div id="sideUpgradeList" class="upgrade-list"></div>
        </section>
      </aside>
    </main>

    <nav class="bottom-nav" aria-label="모바일 메뉴">
      <button type="button" data-nav-action="cafe" aria-label="카페 보기">
        <span aria-hidden="true">🏠</span>
        <span>카페</span>
      </button>
      <button type="button" data-nav-action="cats" aria-label="고양이 보기">
        <span aria-hidden="true">🐱</span>
        <span>고양이</span>
      </button>
      <button type="button" data-nav-action="shop" aria-label="상점 열기">
        <span aria-hidden="true">🛒</span>
        <span>상점</span>
      </button>
      <button type="button" data-nav-action="upgrades" aria-label="업그레이드 열기">
        <span aria-hidden="true">⬆</span>
        <span>업그레이드</span>
      </button>
    </nav>
  </div>

  <div id="shopModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
    <section class="modal-panel shop-panel">
      <div class="modal-header">
        <h2 id="shopTitle">상점</h2>
        <button class="icon-button" type="button" data-close-modal="shopModal" aria-label="상점 닫기">✕</button>
      </div>
      <div class="shop-tabs" role="tablist" aria-label="상점 카테고리">
        <button type="button" class="shop-tab active" data-shop-tab="cats">고양이</button>
        <button type="button" class="shop-tab" data-shop-tab="furniture">가구</button>
        <button type="button" class="shop-tab" data-shop-tab="equipment">장비</button>
      </div>
      <div id="shopItems" class="shop-grid"></div>
    </section>
  </div>

  <div id="catsModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="catsTitle">
    <section class="modal-panel">
      <div class="modal-header">
        <h2 id="catsTitle">고양이</h2>
        <button class="icon-button" type="button" data-close-modal="catsModal" aria-label="고양이 창 닫기">✕</button>
      </div>
      <div id="catCollection" class="cat-collection"></div>
    </section>
  </div>

  <div id="upgradeModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="mobileUpgradeTitle">
    <section class="modal-panel">
      <div class="modal-header">
        <h2 id="mobileUpgradeTitle">업그레이드</h2>
        <button class="icon-button" type="button" data-close-modal="upgradeModal" aria-label="업그레이드 창 닫기">✕</button>
      </div>
      <div id="mobileUpgradeList" class="upgrade-list"></div>
    </section>
  </div>

  <div id="settingsModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <section class="modal-panel settings-panel">
      <div class="modal-header">
        <h2 id="settingsTitle">설정</h2>
        <button class="icon-button" type="button" data-close-modal="settingsModal" aria-label="설정 닫기">✕</button>
      </div>
      <div class="settings-actions">
        <button id="manualSaveButton" class="primary-button" type="button">게임 저장</button>
        <button id="resetGameButton" class="danger-button" type="button">게임 초기화</button>
      </div>
      <p class="settings-note">게임은 30초마다 자동 저장됩니다.</p>
    </section>
  </div>

  <div id="coffeeModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="coffeeMiniGameTitle">
    <section class="modal-panel coffee-panel">
      <div class="modal-header">
        <div>
          <h2 id="coffeeMiniGameTitle">커피 제조</h2>
          <p id="coffeeMiniGameSubtitle" class="mini-subtitle">원두를 준비하고 추출 타이밍을 맞추세요.</p>
        </div>
        <button id="coffeeCancelButton" class="icon-button" type="button" aria-label="커피 제조 닫기">✕</button>
      </div>

      <div id="coffeeConfirm" class="coffee-confirm hidden" role="status">
        <span>커피 제조를 취소하시겠습니까?</span>
        <div>
          <button id="coffeeKeepButton" class="small-button" type="button">계속</button>
          <button id="coffeeConfirmCancelButton" class="danger-button" type="button">취소</button>
        </div>
      </div>

      <div class="brew-station" aria-hidden="true">
        <div class="brew-machine">
          <span class="brew-machine-top"></span>
          <span id="coffeeStream" class="coffee-stream"></span>
          <span class="brew-cup">☕</span>
        </div>
        <div id="coffeeResultBadge" class="coffee-result-badge">READY</div>
      </div>

      <div class="brew-steps" aria-label="커피 제조 단계">
        <span id="coffeeStepBeans" class="brew-step active">1 원두</span>
        <span id="coffeeStepExtract" class="brew-step">2 추출</span>
        <span id="coffeeStepFinish" class="brew-step">3 완성</span>
      </div>

      <div id="coffeeBeanStep" class="coffee-step-panel">
        <div class="bean-drop" aria-hidden="true">🫘</div>
        <div>
          <h3>원두 준비</h3>
          <p>주문에 맞는 원두를 넣고 추출을 준비합니다.</p>
        </div>
        <button id="addBeansButton" class="primary-button" type="button">원두 넣기</button>
      </div>

      <div id="coffeeExtractStep" class="coffee-step-panel hidden">
        <div class="timing-gauge" aria-label="추출 타이밍 게이지">
          <div class="gauge-zones" aria-hidden="true">
            <span class="zone red"></span>
            <span class="zone yellow"></span>
            <span class="zone green"></span>
            <span class="zone yellow"></span>
            <span class="zone red"></span>
          </div>
          <span id="timingPointer" class="timing-pointer"></span>
        </div>
        <div class="extraction-progress" aria-hidden="true">
          <span id="extractionProgressFill"></span>
        </div>
        <button id="startExtractionButton" class="primary-button" type="button">추출 시작</button>
        <button id="stopExtractionButton" class="secondary-button hidden" type="button">타이밍 맞추기</button>
      </div>

      <div id="coffeeFinishStep" class="coffee-step-panel hidden">
        <div class="finished-cup" aria-hidden="true">☕</div>
        <div>
          <h3 id="coffeeFinishTitle">커피 완성!</h3>
          <p id="coffeeFinishText">손님에게 전달할 수 있습니다.</p>
        </div>
        <button id="coffeeDoneButton" class="primary-button" type="button">완료</button>
      </div>
    </section>
  </div>

  <div id="levelUpToast" class="level-up hidden" role="status" aria-live="polite"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="./script.js"></script>
</body>
</html>
