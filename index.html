<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meow Cafe Tycoon</title>
  <link rel="stylesheet" href="./style.css?v=20260813">
</head>
<body>
  <div class="app-shell">
    <header class="top-bar">
      <div class="brand-block" aria-label="게임 이름">
        <span class="brand-mark" aria-hidden="true">🐾</span>
        <div>
          <h1>Meow Cafe Tycoon</h1>
          <p>고양이 카페 운영 중</p>
        </div>
      </div>

      <div class="hud" aria-label="게임 상태">
        <div class="hud-item coins">
          <span aria-hidden="true">🪙</span>
          <strong id="coinCount">500</strong>
          <span>코인</span>
        </div>

        <div class="level-box">
          <div class="level-label">
            <span id="levelLabel">Lv. 1</span>
            <span id="xpLabel">0 / 100 XP</span>
          </div>
          <div class="xp-track" aria-label="경험치">
            <div id="xpFill" class="xp-fill"></div>
          </div>
        </div>

        <button id="settingsButton" class="icon-button" type="button" aria-label="설정 열기">
          ⚙️
        </button>
      </div>
    </header>

    <main class="game-layout">
      <section class="play-section" aria-label="카페 플레이 공간">
        <div id="eventBanner" class="event-banner" aria-live="polite"></div>

        <div id="cafeStage" class="cafe-stage">
          <div class="cafe-wall" aria-hidden="true"></div>
          <div class="window-shape window-one" aria-hidden="true"></div>
          <div class="window-shape window-two" aria-hidden="true"></div>
          <div class="counter-shape" aria-hidden="true"></div>
          <div class="kitchen-floor" aria-hidden="true"></div>
          <div class="cat-corner-rug" aria-hidden="true"></div>

          <section id="orderBoard" class="order-board" aria-label="현재 주문">
            <div class="order-board-title">
              <span>주문</span>
              <span id="missionChip" class="mission-chip">🎯 0/5</span>
            </div>
            <div id="orderList" class="order-list">대기 중</div>
          </section>

          <div id="furnitureLayer" class="furniture-layer" aria-hidden="true"></div>
          <div id="tableLayer" class="table-layer" aria-label="테이블"></div>
          <div id="customerLayer" class="customer-layer" aria-label="손님"></div>
          <div id="catLayer" class="cat-layer" aria-label="고양이"></div>
          <div id="floatingLayer" class="floating-layer" aria-hidden="true"></div>

          <button id="coffeeMachine" class="equipment-object coffee-machine" type="button" data-machine-key="coffeeMachine" data-asset="./assets/machines/coffee-machine.webp" aria-label="커피 머신에서 음료 제작">
            <span class="object-sprite coffee-sprite" data-fallback="☕" aria-hidden="true">
              <span class="espresso-body css-object-part"></span>
              <span class="espresso-panel css-object-part"></span>
              <span class="espresso-gauge espresso-gauge-left css-object-part"></span>
              <span class="espresso-gauge espresso-gauge-right css-object-part"></span>
              <span class="espresso-portafilter css-object-part"></span>
              <span class="espresso-spout css-object-part"></span>
              <span class="espresso-stream css-object-part"></span>
              <span class="espresso-tray css-object-part"></span>
              <span class="espresso-cup css-object-part"></span>
              <span class="coffee-decor bean-jar css-object-part"></span>
              <span class="coffee-decor milk-bottle css-object-part"></span>
              <span class="emoji-fallback">☕</span>
            </span>
            <span class="machine-title">커피 머신</span>
            <span id="machineStatus" class="machine-status">주문 대기</span>
            <span class="machine-progress" aria-hidden="true">
              <span id="machineProgressFill"></span>
            </span>
          </button>

          <button id="ovenMachine" class="equipment-object oven-machine" type="button" data-machine-key="oven" data-asset="./assets/machines/oven.webp" aria-label="오븐에서 빵 제작">
            <span class="object-sprite oven-sprite" data-fallback="🥐" aria-hidden="true">
              <span class="oven-body css-object-part"></span>
              <span class="oven-door css-object-part"></span>
              <span class="oven-glass css-object-part"></span>
              <span class="oven-handle css-object-part"></span>
              <span class="oven-knob oven-knob-left css-object-part"></span>
              <span class="oven-knob oven-knob-right css-object-part"></span>
              <span class="oven-tray css-object-part"></span>
              <span class="oven-bread oven-bread-one css-object-part"></span>
              <span class="oven-bread oven-bread-two css-object-part"></span>
              <span class="emoji-fallback">🥐</span>
            </span>
            <span class="machine-title">오븐</span>
            <span id="ovenStatus" class="machine-status">Lv.2 해금</span>
            <span class="machine-lock" aria-hidden="true">🔒</span>
          </button>

          <button id="blenderMachine" class="equipment-object blender-machine" type="button" data-machine-key="blender" data-asset="./assets/machines/blender.webp" aria-label="블렌더에서 주스 제작">
            <span class="object-sprite blender-sprite" data-fallback="🍹" aria-hidden="true">
              <span class="blender-lid css-object-part"></span>
              <span class="blender-jar css-object-part"></span>
              <span class="blender-juice css-object-part"></span>
              <span class="blender-blade css-object-part"></span>
              <span class="blender-neck css-object-part"></span>
              <span class="blender-base css-object-part"></span>
              <span class="blender-button blender-button-one css-object-part"></span>
              <span class="blender-button blender-button-two css-object-part"></span>
              <span class="juice-decor orange-dot css-object-part"></span>
              <span class="juice-decor berry-dot css-object-part"></span>
              <span class="emoji-fallback">🍹</span>
            </span>
            <span class="machine-title">블렌더</span>
            <span id="blenderStatus" class="machine-status">Lv.3 해금</span>
            <span class="machine-lock" aria-hidden="true">🔒</span>
          </button>

          <button id="bakeryShowcase" class="bakery-showcase" type="button" data-asset="./assets/furniture/bakery-showcase.webp" aria-label="빵 쇼케이스 보기">
            <span class="showcase-sprite" aria-hidden="true">
              <span class="showcase-glass css-object-part"></span>
              <span class="showcase-base css-object-part"></span>
              <span class="showcase-shelf css-object-part"></span>
              <span class="showcase-bread croissant-small css-object-part"></span>
              <span class="showcase-bread toast-small css-object-part"></span>
              <span class="showcase-bread bun-small css-object-part"></span>
              <span class="emoji-fallback">🥐</span>
            </span>
            <span class="machine-title">쇼케이스</span>
          </button>

          <div id="readyShelf" class="ready-shelf" aria-label="완성 음식 보관대"></div>

          <button id="cupEventButton" class="cup-event hidden" type="button" aria-label="떨어진 컵 줍기">
            🥤
          </button>
        </div>
      </section>

      <aside id="sidePanel" class="side-panel" aria-label="관리 메뉴">
        <div class="panel-header">
          <h2>관리 메뉴</h2>
          <button id="quickSaveButton" class="small-button" type="button">저장</button>
        </div>

        <div class="summary-grid">
          <div>
            <span>테이블</span>
            <strong id="tableSummary">2개</strong>
          </div>
          <div>
            <span>완성 메뉴</span>
            <strong id="drinkSummary">0개</strong>
          </div>
          <div>
            <span>손님</span>
            <strong id="customerSummary">0명</strong>
          </div>
          <div>
            <span>판매</span>
            <strong id="salesSummary">0회</strong>
          </div>
        </div>

        <div class="panel-actions">
          <button id="openShopButton" class="primary-button" type="button">상점 열기</button>
          <button id="openCatsButton" class="secondary-button" type="button">고양이 보기</button>
        </div>

        <section class="upgrade-section" aria-labelledby="upgradeTitle">
          <div class="section-title-row">
            <h2 id="upgradeTitle">업그레이드</h2>
            <span id="upgradeHint">수익을 올려 카페를 확장하세요</span>
          </div>
          <div id="sideUpgradeList" class="upgrade-list"></div>
        </section>
      </aside>
    </main>

    <nav class="bottom-nav" aria-label="모바일 메뉴">
      <button type="button" data-nav-action="cafe" aria-label="카페 보기">
        <span aria-hidden="true">🏠</span>
        <span>카페</span>
      </button>
      <button type="button" data-nav-action="cats" aria-label="고양이 보기">
        <span aria-hidden="true">🐱</span>
        <span>고양이</span>
      </button>
      <button type="button" data-nav-action="shop" aria-label="상점 열기">
        <span aria-hidden="true">🛒</span>
        <span>상점</span>
      </button>
      <button type="button" data-nav-action="upgrades" aria-label="업그레이드 열기">
        <span aria-hidden="true">⬆</span>
        <span>업그레이드</span>
      </button>
    </nav>
  </div>

  <div id="shopModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
    <section class="modal-panel shop-panel">
      <div class="modal-header">
        <h2 id="shopTitle">상점</h2>
        <button class="icon-button" type="button" data-close-modal="shopModal" aria-label="상점 닫기">✕</button>
      </div>
      <div class="shop-tabs" role="tablist" aria-label="상점 카테고리">
        <button type="button" class="shop-tab active" data-shop-tab="cats">고양이</button>
        <button type="button" class="shop-tab" data-shop-tab="furniture">가구</button>
        <button type="button" class="shop-tab" data-shop-tab="equipment">장비</button>
      </div>
      <div id="shopItems" class="shop-grid"></div>
    </section>
  </div>

  <div id="catsModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="catsTitle">
    <section class="modal-panel">
      <div class="modal-header">
        <h2 id="catsTitle">고양이</h2>
        <button class="icon-button" type="button" data-close-modal="catsModal" aria-label="고양이 창 닫기">✕</button>
      </div>
      <div id="catCollection" class="cat-collection"></div>
    </section>
  </div>

  <div id="upgradeModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="mobileUpgradeTitle">
    <section class="modal-panel">
      <div class="modal-header">
        <h2 id="mobileUpgradeTitle">업그레이드</h2>
        <button class="icon-button" type="button" data-close-modal="upgradeModal" aria-label="업그레이드 창 닫기">✕</button>
      </div>
      <div id="mobileUpgradeList" class="upgrade-list"></div>
    </section>
  </div>

  <div id="settingsModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <section class="modal-panel settings-panel">
      <div class="modal-header">
        <h2 id="settingsTitle">설정</h2>
        <button class="icon-button" type="button" data-close-modal="settingsModal" aria-label="설정 닫기">✕</button>
      </div>
      <div class="settings-actions">
        <button id="manualSaveButton" class="primary-button" type="button">게임 저장</button>
        <button id="resetGameButton" class="danger-button" type="button">게임 초기화</button>
      </div>
      <p class="settings-note">게임은 30초마다 자동 저장됩니다.</p>
    </section>
  </div>

  <div id="coffeeModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="coffeeMiniGameTitle">
    <section class="modal-panel coffee-panel">
      <div class="modal-header">
        <div>
          <h2 id="coffeeMiniGameTitle">메뉴 제조</h2>
          <p id="coffeeMiniGameSubtitle" class="mini-subtitle">주문에 맞는 메뉴를 직접 만들어 보세요.</p>
        </div>
        <button id="coffeeCancelButton" class="icon-button" type="button" aria-label="제조 닫기">✕</button>
      </div>

      <div id="coffeeConfirm" class="coffee-confirm hidden" role="status">
        <span>제조를 취소하시겠습니까?</span>
        <div>
          <button id="coffeeKeepButton" class="small-button" type="button">계속</button>
          <button id="coffeeConfirmCancelButton" class="danger-button" type="button">취소</button>
        </div>
      </div>

      <div id="miniGameVisual" class="brew-station mini-game-visual" aria-hidden="true">
        <div id="miniGameProp" class="mini-game-prop">
          <span id="miniGameIcon" class="mini-game-icon">☕</span>
          <span id="coffeeStream" class="coffee-stream"></span>
        </div>
        <div id="coffeeResultBadge" class="coffee-result-badge">READY</div>
      </div>

      <div id="miniGameSteps" class="brew-steps" aria-label="제조 단계"></div>

      <div id="miniGameBody" class="coffee-step-panel mini-game-body"></div>

      <div class="mini-game-actions">
        <button id="miniGameActionButton" class="primary-button" type="button">시작</button>
        <button id="miniGameSecondaryButton" class="secondary-button hidden" type="button">완료</button>
      </div>
    </section>
  </div>

  <div id="levelUpToast" class="level-up hidden" role="status" aria-live="polite"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="./script.js?v=20260813"></script>
</body>
</html>
